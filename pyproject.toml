[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborwave"
version = "0.1.0"
description = "Harbour wave agitation with the mild-slope equation, P1 finite elements"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abderrazzak El Ammari"}]
keywords = ["finite elements", "mild-slope", "Helmholtz", "coastal engineering", "harbour"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
app = ["streamlit>=1.30", "matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/<abderrazzak-elammari>/harborwave"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
